trigger: questioned whether gemma4:26b-a4b-it-qat is the right model for Health Event Fix Proposal / Log Analysis Agent's "reason about a fix, or confidently decline" role, given it was never validated by a real integration test per the 2026-06-08 report's own caveat
method: full 15-payload sweep on both models, focused on structured_json_fix_proposal / structured_json_triage_summary (mirror the production prompt shapes exactly); refusal_boundary re-checked with a 5-repeat run to rule out sampling variance after finding an unexpected regression
