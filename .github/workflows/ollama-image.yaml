name: ollama-image

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly — check for new upstream rocm tag
  push:
    branches: [main]
    paths:
      - 'docker/ollama/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: arc-runner-docker
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream ROCm tag
        id: upstream
        run: |
          TAG=$(curl -s "https://registry.hub.docker.com/v2/repositories/ollama/ollama/tags?page_size=100" \
            | python3 -c "
          import sys, json
          tags = json.load(sys.stdin).get('results', [])
          rocm = [t['name'] for t in tags if 'rocm' in t['name'] and 'homelab' not in t['name']]
          print(rocm[0] if rocm else 'rocm')
          ")
          echo "upstream_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $TAG"

      - name: Compute image tag
        id: meta
        run: |
          TAG="${{ steps.upstream.outputs.upstream_tag }}-homelab"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Check if image already exists in Harbor
        id: exists
        run: |
          if docker manifest inspect harbor.internal/ai/ollama:${{ steps.meta.outputs.tag }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists — skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Harbor
        if: steps.exists.outputs.exists != 'true'
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login harbor.internal -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build image
        if: steps.exists.outputs.exists != 'true'
        run: |
          docker build \
            --build-arg UPSTREAM_TAG=${{ steps.upstream.outputs.upstream_tag }} \
            -t harbor.internal/ai/ollama:${{ steps.meta.outputs.tag }} \
            -t harbor.internal/ai/ollama:latest \
            docker/ollama/

      - name: Push image
        if: steps.exists.outputs.exists != 'true'
        run: |
          docker push harbor.internal/ai/ollama:${{ steps.meta.outputs.tag }}
          docker push harbor.internal/ai/ollama:latest

      - name: Summary
        run: |
          echo "## Ollama Image Build" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Upstream tag | ${{ steps.upstream.outputs.upstream_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | ${{ steps.meta.outputs.tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skipped | ${{ steps.exists.outputs.exists == 'true' }} |" >> "$GITHUB_STEP_SUMMARY"
