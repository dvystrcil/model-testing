name: model-sweep

on:
  # Manual trigger only — auto-on-push was removed 2026-05-15 after two
  # back-to-back commits today each triggered a full sweep that competed
  # for VRAM with the user's live work (one trip of the ollama-inference
  # health-watcher alarm). Sweeps now happen when explicitly invoked.
  workflow_dispatch:
    inputs:
      model:
        description: 'Single model to test (leave blank for all)'
        required: false
        default: ''
      payload:
        description: 'Payload name or "all"'
        required: false
        default: 'all'
      runs:
        description: 'Runs per model/payload pair'
        required: false
        default: '1'
      system_prompt:
        description: 'Extra text appended to the system message of every payload (leave blank for none)'
        required: false
        default: ''
      temperature:
        description: 'Override temperature for ALL payloads (e.g. 0.0 for deterministic code-task sweeps). Leave blank to keep per-payload spec.'
        required: false
        default: ''
      requester:
        description: 'Who/what triggered this sweep. Free-form (e.g. "operator", "n8n:sweep-runner", "@user"). Logged in the analyze step and surfaces in the n8n-posted tracking issue.'
        required: false
        default: 'operator'

# Single-sweep mutex: queue subsequent runs instead of cancelling the
# in-progress one. gfx1151 ollama wedge fear (project_ollama_wedge_mode):
# cancelling a sweep mid-flight leaves partially-loaded models in ollama
# memory and the GPU in an indeterminate state, which has wedged max-01
# in the past. Queueing means the second request waits ~1-2 hours; that's
# the correct trade.
concurrency:
  group: model-sweep
  cancel-in-progress: false

env:
  RESULTS_BASE: /mnt/benchmark-results

jobs:
  setup:
    runs-on: model-testing-runner
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.payload || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            PAYLOADS=$(ls benchmarks/payloads/*.json \
              | xargs -I{} basename {} .json \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            PAYLOADS=$(printf '%s' "$INPUT" | jq -R -c '[.]')
          fi
          echo "matrix={\"payload\":$PAYLOADS}" >> "$GITHUB_OUTPUT"

  sweep:
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 1   # one payload at a time — Ollama is single-GPU
      fail-fast: false  # a timeout on one payload does not cancel the rest
    runs-on: model-testing-runner
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      # Probe live ollama version so the cache key changes when the binary
      # changes. Without this, an upstream binary upgrade (e.g. 0.24 -> 0.30.2
      # on 2026-06-02) silently re-serves prior results because nothing in the
      # workflow inputs changed. Regression-tested by
      # .github/workflows/test-cache.yaml::verify-version-bump-misses.
      - name: Probe ollama version
        id: ollama
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
        run: |
          VERSION=$(curl -fsS --max-time 10 "${OLLAMA_URL}/api/version" | jq -r '.version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not probe ollama version from ${OLLAMA_URL}/api/version — refusing to generate cache key without it (would risk stale-cache reuse on binary upgrades)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Ollama version: $VERSION"

      - name: Generate cache key
        id: cache-key
        env:
          OLLAMA_VERSION: ${{ steps.ollama.outputs.version }}
        run: |
          PAYLOAD_HASH=$(sha256sum benchmarks/payloads/${{ matrix.payload }}.json | cut -c1-16)
          MODELS_HASH=$(sha256sum models.yaml | cut -c1-16)
          RUNS="${{ github.event.inputs.runs || '1' }}"
          MODEL="${{ github.event.inputs.model || 'all' }}"
          SYSPROMPT_HASH=$(echo -n "${{ github.event.inputs.system_prompt }}" | sha256sum | cut -c1-8)
          KEY="sweep-${{ matrix.payload }}-p${PAYLOAD_HASH}-m${MODELS_HASH}-r${RUNS}-m${MODEL}-s${SYSPROMPT_HASH}-o${OLLAMA_VERSION}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Cache key: $KEY"

      - name: Restore cached results
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: benchmarks/results/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Report cache hit
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: echo "Cache hit — skipping Ollama for ${{ matrix.payload }}"

      - uses: actions/setup-python@v7
        if: steps.cache-restore.outputs.cache-hit != 'true'
        with:
          python-version: '3.14'

      - name: Install dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Install kubectl
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          KUBECTL_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Run sweep — ${{ matrix.payload }}
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
        run: |
          ARGS=(--ollama "$OLLAMA_URL"
                --payload "${{ matrix.payload }}"
                --runs "${{ github.event.inputs.runs || '1' }}")
          [ -n "${{ github.event.inputs.model }}" ] && \
            ARGS+=(--model "${{ github.event.inputs.model }}")
          [ -n "${{ github.event.inputs.system_prompt }}" ] && \
            ARGS+=(--system-prompt "${{ github.event.inputs.system_prompt }}")
          [ -n "${{ github.event.inputs.temperature }}" ] && \
            ARGS+=(--temperature "${{ github.event.inputs.temperature }}")
          python benchmarks/run_benchmark.py "${ARGS[@]}"

      - name: Save results to cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: benchmarks/results/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Copy results to PVC — ${{ matrix.payload }}
        if: always()
        run: |
          DEST="${RESULTS_BASE}/run-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp benchmarks/results/sweep_*.jsonl "$DEST/${{ matrix.payload }}.jsonl" 2>/dev/null \
            && echo "Copied results to $DEST/${{ matrix.payload }}.jsonl" \
            || echo "No result file found for ${{ matrix.payload }} — job may have failed"

  analyze:
    # `setup` too, not just `sweep` — analyze needs the matrix it was
    # supposed to cover in order to tell a missing family from one that was
    # never requested.
    needs: [setup, sweep]
    if: always()
    runs-on: model-testing-runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # OWUI_API_KEY is sourced from Infisical (homelab-bz-gt/prod) —
      # matches the helm-update-ai pattern (feedback_cicd_app_not_pat,
      # feedback_match_sibling_workflow_conventions). The repo secrets
      # INFISICAL_CLIENT_ID + INFISICAL_CLIENT_SECRET must be set once
      # before the first sweep — see feedback_new_repo_infisical_secrets.
      # The action exports OWUI_API_KEY into the GHA environment so
      # subsequent steps read it via ${{ env.OWUI_API_KEY }}.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Analyze results (local — qwen3.6:35b)
        id: analyze-local
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
          # Bound here rather than inline in the script below. An expression
          # inside a `run:` block scalar has to nest its own single-quoted
          # string literal inside the shell's quoting, and getting that wrong
          # does not fail the step — it makes the whole workflow file
          # unparseable, so every job disappears and the run reports
          # `startup_failure` with no step to point at (2026-08-15: shipped
          # `","`, which GHA rejects since expression literals are
          # single-quoted). As a standalone `env:` value the expression is a
          # plain YAML scalar with no nesting at all.
          EXPECTED_PAYLOADS: ${{ join(fromJson(needs.setup.outputs.matrix).payload, ',') }}
        run: |
          RUN_DIR="${RESULTS_BASE}/run-${{ github.run_id }}"
          FILES=$(find "$RUN_DIR" -name "*.jsonl" 2>/dev/null | sort | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No result files found in $RUN_DIR — all sweep jobs may have failed."
            exit 1
          fi
          # Stash for the Claude step to reuse without re-finding.
          echo "result_files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Analyzing: $FILES"
          # Prepend a header line that downstream consumers (the n8n
          # sweep-runner posting tracking issues) can grep for to know
          # which sweep this report belongs to.
          {
            echo "<!--"
            echo "  sweep_id:   ${{ github.run_id }}"
            echo "  model:      ${{ github.event.inputs.model || 'all' }}"
            echo "  payload:    ${{ github.event.inputs.payload || 'all' }}"
            echo "  runs:       ${{ github.event.inputs.runs || '1' }}"
            echo "  requester:  ${{ github.event.inputs.requester || 'operator' }}"
            echo "-->"
            echo
          } > report.md
          # --expect is the matrix this run was actually launched with, so a
          # deliberate single-payload sweep is complete at 1/1 while a failed
          # job in a full sweep is not. The marker analyze prints is captured
          # for the assertion step below.
          # pipefail so a tee'd failure is still a failure. The tee keeps
          # progress visible during a 30-minute LLM call while writing the
          # marker to a file the next step can read deterministically —
          # process substitution would race the assertion.
          set -o pipefail
          python benchmarks/analyze.py $FILES \
            --ollama "$OLLAMA_URL" \
            --expect "$EXPECTED_PAYLOADS" \
            --out /tmp/analyze.md 2>&1 | tee /tmp/analyze.err
          cat /tmp/analyze.md >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cp report.md "${RESULTS_BASE}/run-${{ github.run_id }}/report.md"

      # Deliberately a SEPARATE step, after the report has been written and
      # copied to the PVC. Failing inside the step above would abort before
      # `cp`, discarding a perfectly good report for 23 families because the
      # 24th failed — losing more data to the alarm than to the fault.
      - name: Assert every requested payload was analyzed
        run: |
          MARKER=$(grep -m1 '^ANALYZE-COVERAGE' /tmp/analyze.err 2>/dev/null || true)
          if [ -z "$MARKER" ]; then
            echo "::error::analyze.py emitted no ANALYZE-COVERAGE marker — "
            echo "coverage was never evaluated, so this run proves nothing "
            echo "about completeness."
            exit 1
          fi
          echo "$MARKER"
          case "$MARKER" in
            *"expected=unknown"*)
              echo "::error::coverage UNKNOWN — the expected payload set did "
              echo "not reach analyze.py (check the matrix expression)."
              exit 1 ;;
            *"missing=none"*"unexpected=none"*)
              echo "All requested payloads were analyzed." ;;
            *)
              echo "::error::${MARKER} — at least one payload produced no "
              echo "results. The report is published but INCOMPLETE; see its "
              echo "Coverage section."
              exit 1 ;;
          esac

      # Phase 2 dual-summarize (model-testing#36): same JSONL data also
      # gets analyzed via Claude (through OWUI's Anthropic Connection) so
      # every sweep produces two paired summaries — one local, one Claude.
      # That data closes the A3 row of homelab#292 (quality-gap
      # measurement of Anthropic vs local LLMs).
      #
      # continue-on-error so a Claude/OWUI failure (network, rate limit,
      # missing secret on fresh deploy) doesn't fail the whole sweep —
      # we still ship the local report. The notify step downstream
      # checks for report-claude.md and falls back to a stub if missing.
      - name: Analyze results (Claude — claude-haiku-4-5)
        id: analyze-claude
        continue-on-error: true
        env:
          OWUI_URL: http://open-webui.open-webui.svc.cluster.local
          # OWUI_API_KEY is already in the GHA environment from the
          # earlier Infisical/secrets-action step — no explicit
          # mapping needed here.
          CLAUDE_MODEL: claude-haiku-4-5-20251001
        run: |
          if [ -z "$OWUI_API_KEY" ]; then
            echo "::warning::OWUI_API_KEY not sourced from Infisical — skipping Claude analysis. Check that the Infisical Fetch step succeeded and that homelab-bz-gt/prod has OWUI_API_KEY defined."
            exit 0
          fi
          FILES="${{ steps.analyze-local.outputs.result_files }}"
          if [ -z "$FILES" ]; then
            echo "No result files to analyze; skipping Claude step."
            exit 0
          fi
          {
            echo "<!--"
            echo "  sweep_id:   ${{ github.run_id }}"
            echo "  summarizer: $CLAUDE_MODEL"
            echo "-->"
            echo
          } > report-claude.md
          python benchmarks/analyze_claude.py $FILES \
            --owui-url "$OWUI_URL" \
            --model "$CLAUDE_MODEL" \
            --out /tmp/analyze-claude.md
          cat /tmp/analyze-claude.md >> report-claude.md
          echo "## Claude analysis (via OWUI)" >> "$GITHUB_STEP_SUMMARY"
          cat report-claude.md >> "$GITHUB_STEP_SUMMARY"
          cp report-claude.md "${RESULTS_BASE}/run-${{ github.run_id }}/report-claude.md"

      # Upload report.md (local) + report-claude.md (Claude) as workflow
      # artifacts so the n8n sweep-runner can fetch them via the GH API
      # without needing PVC mounts. Retained for 30 days; the canonical
      # copies live on the benchmark-results PVC for longer-term querying.
      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ github.run_id }}
          path: |
            report.md
            report-claude.md
          retention-days: 30
          if-no-files-found: warn

      - name: Prune runs older than 30 days
        if: always()
        run: |
          find "${RESULTS_BASE}" -maxdepth 1 -mindepth 1 -type d -mtime +30 \
            -exec echo "Pruning: {}" \; -exec rm -rf {} +

      # Final step: notify the n8n model_sweep_complete webhook so the
      # tracking GH issue gets a result comment + Discord ping. The
      # webhook receiver lives in n8n-workflow/workflows/model_sweep_complete.json
      # (model-testing#36 Phase 1 PR2).
      #
      # report.md is inlined as a string via `jq --rawfile` so n8n does
      # not have to authenticate against the GH artifacts API to fetch
      # it — significantly simpler. If report.md is missing (sweep
      # failed before analyze), fall back to a stub so the JSON body is
      # still valid.
      #
      # Defensive: non-fatal on webhook failure. report.md is on the
      # PVC + as a 30-day artifact regardless, so a missed notification
      # doesn't lose data — operator fetches by run_id manually.
      - name: Notify n8n sweep-complete webhook
        if: always()
        env:
          N8N_WEBHOOK_URL: http://n8n.n8n-workflow.svc.cluster.local/webhook/model-sweep-complete
        run: |
          STATUS="${{ job.status }}"
          REPORT_FILE="report.md"
          if [ ! -f "$REPORT_FILE" ]; then
            REPORT_FILE="/tmp/empty-report.md"
            printf "_(no report.md produced — sweep failed before analyze step)_\n" > "$REPORT_FILE"
          fi
          # Claude side: may be missing if the secret is unset or the step
          # failed (continue-on-error). Stub so the JSON body stays valid.
          REPORT_CLAUDE_FILE="report-claude.md"
          if [ ! -f "$REPORT_CLAUDE_FILE" ]; then
            REPORT_CLAUDE_FILE="/tmp/empty-report-claude.md"
            printf "_(no Claude analysis produced — OWUI_API_KEY may be unset, or the analyze-claude step failed)_\n" > "$REPORT_CLAUDE_FILE"
          fi
          BODY=$(jq -nc \
            --arg run_id "${{ github.run_id }}" \
            --arg status "$STATUS" \
            --arg model "${{ github.event.inputs.model }}" \
            --arg requester "${{ github.event.inputs.requester }}" \
            --arg payload "${{ github.event.inputs.payload }}" \
            --rawfile report "$REPORT_FILE" \
            --rawfile report_claude "$REPORT_CLAUDE_FILE" \
            '{run_id: $run_id, status: $status, model: $model, requester: $requester, payload: $payload, report: $report, report_claude: $report_claude}')
          curl -sS --max-time 60 -X POST \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            "$N8N_WEBHOOK_URL" \
            && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::n8n sweep-complete notification failed (rc=$rc). report.md is still on PVC at ${RESULTS_BASE}/run-${{ github.run_id }}/report.md and as workflow artifact."
          fi
