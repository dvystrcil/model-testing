name: model-sweep

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/payloads/**'
      - 'models.yaml'
      - 'benchmarks/run_benchmark.py'
      - 'benchmarks/analyze.py'
  workflow_dispatch:
    inputs:
      model:
        description: 'Single model to test (leave blank for all)'
        required: false
        default: ''
      payload:
        description: 'Payload name or "all"'
        required: false
        default: 'all'
      runs:
        description: 'Runs per model/payload pair'
        required: false
        default: '1'

concurrency:
  group: model-sweep
  cancel-in-progress: true

jobs:
  setup:
    runs-on: model-testing-runner
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.payload || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            PAYLOADS=$(ls benchmarks/payloads/*.json \
              | xargs -I{} basename {} .json \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            PAYLOADS=$(printf '%s' "$INPUT" | jq -R -c '[.]')
          fi
          echo "matrix={\"payload\":$PAYLOADS}" >> "$GITHUB_OUTPUT"

  sweep:
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 1   # one payload at a time — Ollama is single-GPU
      fail-fast: false  # a timeout on one payload does not cancel the rest
    runs-on: model-testing-runner
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Run sweep — ${{ matrix.payload }}
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
        run: |
          MODEL_ARG=""
          if [ -n "${{ github.event.inputs.model }}" ]; then
            MODEL_ARG="--model ${{ github.event.inputs.model }}"
          fi
          python benchmarks/run_benchmark.py \
            --ollama "$OLLAMA_URL" \
            --payload "${{ matrix.payload }}" \
            --runs "${{ github.event.inputs.runs || '1' }}" \
            $MODEL_ARG

      - name: Upload results — ${{ matrix.payload }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.payload }}
          path: benchmarks/results/
          retention-days: 30

  analyze:
    needs: sweep
    if: always()
    runs-on: model-testing-runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all sweep artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: downloaded-results/
          merge-multiple: false

      - name: Analyze results
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
        run: |
          FILES=$(find downloaded-results/ -name "sweep_*.jsonl" | sort | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No result files found — all sweep jobs may have failed."
            exit 1
          fi
          echo "Merging files: $FILES"
          python benchmarks/analyze.py $FILES \
            --ollama "$OLLAMA_URL" \
            --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.run_id }}
          path: report.md
          retention-days: 30
