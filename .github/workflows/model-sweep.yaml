name: model-sweep

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/payloads/**'
      - 'models.yaml'
      - 'benchmarks/run_benchmark.py'
      - 'benchmarks/analyze.py'
  workflow_dispatch:
    inputs:
      model:
        description: 'Single model to test (leave blank for all)'
        required: false
        default: ''
      payload:
        description: 'Payload name or "all"'
        required: false
        default: 'all'
      runs:
        description: 'Runs per model/payload pair'
        required: false
        default: '1'
      system_prompt:
        description: 'Extra text appended to the system message of every payload (leave blank for none)'
        required: false
        default: ''

concurrency:
  group: model-sweep
  cancel-in-progress: true

env:
  RESULTS_BASE: /mnt/benchmark-results

jobs:
  setup:
    runs-on: model-testing-runner
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.payload || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            PAYLOADS=$(ls benchmarks/payloads/*.json \
              | xargs -I{} basename {} .json \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            PAYLOADS=$(printf '%s' "$INPUT" | jq -R -c '[.]')
          fi
          echo "matrix={\"payload\":$PAYLOADS}" >> "$GITHUB_OUTPUT"

  sweep:
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 1   # one payload at a time — Ollama is single-GPU
      fail-fast: false  # a timeout on one payload does not cancel the rest
    runs-on: model-testing-runner
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: |
          PAYLOAD_HASH=$(sha256sum benchmarks/payloads/${{ matrix.payload }}.json | cut -c1-16)
          MODELS_HASH=$(sha256sum models.yaml | cut -c1-16)
          RUNS="${{ github.event.inputs.runs || '1' }}"
          MODEL="${{ github.event.inputs.model || 'all' }}"
          SYSPROMPT_HASH=$(echo -n "${{ github.event.inputs.system_prompt }}" | sha256sum | cut -c1-8)
          KEY="sweep-${{ matrix.payload }}-p${PAYLOAD_HASH}-m${MODELS_HASH}-r${RUNS}-m${MODEL}-s${SYSPROMPT_HASH}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Cache key: $KEY"

      - name: Restore cached results
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/results/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Report cache hit
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: echo "Cache hit — skipping Ollama for ${{ matrix.payload }}"

      - uses: actions/setup-python@v5
        if: steps.cache-restore.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Install kubectl
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          KUBECTL_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Run sweep — ${{ matrix.payload }}
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
        run: |
          ARGS=(--ollama "$OLLAMA_URL"
                --payload "${{ matrix.payload }}"
                --runs "${{ github.event.inputs.runs || '1' }}")
          [ -n "${{ github.event.inputs.model }}" ] && \
            ARGS+=(--model "${{ github.event.inputs.model }}")
          [ -n "${{ github.event.inputs.system_prompt }}" ] && \
            ARGS+=(--system-prompt "${{ github.event.inputs.system_prompt }}")
          python benchmarks/run_benchmark.py "${ARGS[@]}"

      - name: Save results to cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/results/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Copy results to PVC — ${{ matrix.payload }}
        if: always()
        run: |
          DEST="${RESULTS_BASE}/run-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp benchmarks/results/sweep_*.jsonl "$DEST/${{ matrix.payload }}.jsonl" 2>/dev/null \
            && echo "Copied results to $DEST/${{ matrix.payload }}.jsonl" \
            || echo "No result file found for ${{ matrix.payload }} — job may have failed"

  analyze:
    needs: sweep
    if: always()
    runs-on: model-testing-runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analyze results
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
        run: |
          RUN_DIR="${RESULTS_BASE}/run-${{ github.run_id }}"
          FILES=$(find "$RUN_DIR" -name "*.jsonl" 2>/dev/null | sort | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No result files found in $RUN_DIR — all sweep jobs may have failed."
            exit 1
          fi
          echo "Analyzing: $FILES"
          python benchmarks/analyze.py $FILES \
            --ollama "$OLLAMA_URL" \
            --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cp report.md "${RESULTS_BASE}/run-${{ github.run_id }}/report.md"

      - name: Prune runs older than 30 days
        if: always()
        run: |
          find "${RESULTS_BASE}" -maxdepth 1 -mindepth 1 -type d -mtime +30 \
            -exec echo "Pruning: {}" \; -exec rm -rf {} +
