name: model-sweep

on:
  # Manual trigger only — auto-on-push was removed 2026-05-15 after two
  # back-to-back commits today each triggered a full sweep that competed
  # for VRAM with the user's live work (one trip of the ollama-inference
  # health-watcher alarm). Sweeps now happen when explicitly invoked.
  workflow_dispatch:
    inputs:
      model:
        description: 'Single model to test (leave blank for all)'
        required: false
        default: ''
      payload:
        description: 'Payload name or "all"'
        required: false
        default: 'all'
      runs:
        description: 'Runs per model/payload pair'
        required: false
        default: '1'
      system_prompt:
        description: 'Extra text appended to the system message of every payload (leave blank for none)'
        required: false
        default: ''
      temperature:
        description: 'Override temperature for ALL payloads (e.g. 0.0 for deterministic code-task sweeps). Leave blank to keep per-payload spec.'
        required: false
        default: ''
      requester:
        description: 'Who/what triggered this sweep. Free-form (e.g. "operator", "n8n:sweep-runner", "@user"). Logged in the analyze step and surfaces in the n8n-posted tracking issue.'
        required: false
        default: 'operator'

# Single-sweep mutex: queue subsequent runs instead of cancelling the
# in-progress one. gfx1151 ollama wedge fear (project_ollama_wedge_mode):
# cancelling a sweep mid-flight leaves partially-loaded models in ollama
# memory and the GPU in an indeterminate state, which has wedged max-01
# in the past. Queueing means the second request waits ~1-2 hours; that's
# the correct trade.
concurrency:
  group: model-sweep
  cancel-in-progress: false

env:
  RESULTS_BASE: /mnt/benchmark-results

jobs:
  setup:
    runs-on: model-testing-runner
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.payload || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            PAYLOADS=$(ls benchmarks/payloads/*.json \
              | xargs -I{} basename {} .json \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            PAYLOADS=$(printf '%s' "$INPUT" | jq -R -c '[.]')
          fi
          echo "matrix={\"payload\":$PAYLOADS}" >> "$GITHUB_OUTPUT"

  sweep:
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 1   # one payload at a time — Ollama is single-GPU
      fail-fast: false  # a timeout on one payload does not cancel the rest
    runs-on: model-testing-runner
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - name: Generate cache key
        id: cache-key
        run: |
          PAYLOAD_HASH=$(sha256sum benchmarks/payloads/${{ matrix.payload }}.json | cut -c1-16)
          MODELS_HASH=$(sha256sum models.yaml | cut -c1-16)
          RUNS="${{ github.event.inputs.runs || '1' }}"
          MODEL="${{ github.event.inputs.model || 'all' }}"
          SYSPROMPT_HASH=$(echo -n "${{ github.event.inputs.system_prompt }}" | sha256sum | cut -c1-8)
          KEY="sweep-${{ matrix.payload }}-p${PAYLOAD_HASH}-m${MODELS_HASH}-r${RUNS}-m${MODEL}-s${SYSPROMPT_HASH}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Cache key: $KEY"

      - name: Restore cached results
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/results/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Report cache hit
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: echo "Cache hit — skipping Ollama for ${{ matrix.payload }}"

      - uses: actions/setup-python@v6
        if: steps.cache-restore.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Install kubectl
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          KUBECTL_VERSION=$(curl -sL https://dl.k8s.io/release/stable.txt)
          curl -sLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Run sweep — ${{ matrix.payload }}
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
        run: |
          ARGS=(--ollama "$OLLAMA_URL"
                --payload "${{ matrix.payload }}"
                --runs "${{ github.event.inputs.runs || '1' }}")
          [ -n "${{ github.event.inputs.model }}" ] && \
            ARGS+=(--model "${{ github.event.inputs.model }}")
          [ -n "${{ github.event.inputs.system_prompt }}" ] && \
            ARGS+=(--system-prompt "${{ github.event.inputs.system_prompt }}")
          [ -n "${{ github.event.inputs.temperature }}" ] && \
            ARGS+=(--temperature "${{ github.event.inputs.temperature }}")
          python benchmarks/run_benchmark.py "${ARGS[@]}"

      - name: Save results to cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/results/
          key: ${{ steps.cache-key.outputs.key }}

      - name: Copy results to PVC — ${{ matrix.payload }}
        if: always()
        run: |
          DEST="${RESULTS_BASE}/run-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp benchmarks/results/sweep_*.jsonl "$DEST/${{ matrix.payload }}.jsonl" 2>/dev/null \
            && echo "Copied results to $DEST/${{ matrix.payload }}.jsonl" \
            || echo "No result file found for ${{ matrix.payload }} — job may have failed"

  analyze:
    needs: sweep
    if: always()
    runs-on: model-testing-runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analyze results
        env:
          OLLAMA_URL: http://ollama.ollama.svc.cluster.local
        run: |
          RUN_DIR="${RESULTS_BASE}/run-${{ github.run_id }}"
          FILES=$(find "$RUN_DIR" -name "*.jsonl" 2>/dev/null | sort | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "No result files found in $RUN_DIR — all sweep jobs may have failed."
            exit 1
          fi
          echo "Analyzing: $FILES"
          # Prepend a header line that downstream consumers (the n8n
          # sweep-runner posting tracking issues) can grep for to know
          # which sweep this report belongs to.
          {
            echo "<!--"
            echo "  sweep_id:   ${{ github.run_id }}"
            echo "  model:      ${{ github.event.inputs.model || 'all' }}"
            echo "  payload:    ${{ github.event.inputs.payload || 'all' }}"
            echo "  runs:       ${{ github.event.inputs.runs || '1' }}"
            echo "  requester:  ${{ github.event.inputs.requester || 'operator' }}"
            echo "-->"
            echo
          } > report.md
          python benchmarks/analyze.py $FILES \
            --ollama "$OLLAMA_URL" \
            --out /tmp/analyze.md
          cat /tmp/analyze.md >> report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cp report.md "${RESULTS_BASE}/run-${{ github.run_id }}/report.md"

      # Upload report.md as a workflow artifact so the n8n sweep-runner
      # can fetch it via the GH API without needing PVC mounts. Retained
      # for 30 days; the canonical copy lives on the benchmark-results
      # PVC for longer-term querying.
      - name: Upload report.md as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Prune runs older than 30 days
        if: always()
        run: |
          find "${RESULTS_BASE}" -maxdepth 1 -mindepth 1 -type d -mtime +30 \
            -exec echo "Pruning: {}" \; -exec rm -rf {} +

      # Final step: notify the n8n model_sweep_complete webhook so the
      # tracking GH issue gets a result comment + Discord ping. The
      # webhook receiver lives in n8n-workflow/workflows/model_sweep_complete.json
      # (model-testing#36 Phase 1 PR2). Defensive: failures here don't
      # break the workflow — the artifact + report.md are still on the
      # PVC, and the operator can fetch them by run_id.
      - name: Notify n8n sweep-complete webhook
        if: always()
        env:
          N8N_WEBHOOK_URL: http://n8n.n8n.svc.cluster.local:5678/webhook/model-sweep-complete
        run: |
          STATUS="${{ job.status }}"
          BODY=$(jq -nc \
            --arg run_id "${{ github.run_id }}" \
            --arg status "$STATUS" \
            --arg model "${{ github.event.inputs.model }}" \
            --arg requester "${{ github.event.inputs.requester }}" \
            --arg payload "${{ github.event.inputs.payload }}" \
            '{run_id: $run_id, status: $status, model: $model, requester: $requester, payload: $payload}')
          curl -sS --max-time 30 -X POST \
            -H 'Content-Type: application/json' \
            -d "$BODY" \
            "$N8N_WEBHOOK_URL" \
            && rc=0 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::n8n sweep-complete notification failed (rc=$rc). report.md is still on PVC at ${RESULTS_BASE}/run-${{ github.run_id }}/report.md and as workflow artifact."
          fi
