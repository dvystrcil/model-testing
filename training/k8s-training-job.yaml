apiVersion: batch/v1
kind: Job
metadata:
  name: dpo-training
  namespace: ai-training
  labels:
    app.kubernetes.io/name: dpo-training
    app.kubernetes.io/managed-by: argocd
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpo-training
    spec:
      restartPolicy: Never
      # Must run on the GPU node
      nodeSelector:
        kubernetes.io/hostname: k8s-node-max-01
      tolerations:
      - key: gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: trainer
        image: harbor.internal/ai/rocm-trainer:latest
        args:
        - "--model"
        - "Qwen/Qwen2.5-Coder-14B-Instruct"
        - "--dataset"
        - "/data/k8s_resources_dpo.jsonl"
        - "--output"
        - "/output/adapter"
        - "--epochs"
        - "3"
        - "--lora-r"
        - "16"
        env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.5.1"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-token
              key: token
              optional: true
        resources:
          limits:
            amd.com/gpu: "1"
          requests:
            memory: "32Gi"
            cpu: "4"
        volumeMounts:
        - name: training-data
          mountPath: /data
          readOnly: true
        - name: training-output
          mountPath: /output
        - name: model-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: training-data
        persistentVolumeClaim:
          claimName: training-data
      - name: training-output
        persistentVolumeClaim:
          claimName: training-output
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-training
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data
  namespace: ai-training
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-output
  namespace: ai-training
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: ai-training
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 200Gi
